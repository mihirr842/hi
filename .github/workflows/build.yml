name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git openjdk-17-jdk wget unzip zip libgl1-mesa-glx x11-apps xvfb

    - name: Install Flet App Builder
      run: |
        pip install --upgrade pip
        pip install flet pyfirmata

    - name: Execute Flet Compilation Cloud Sequence
      env:
        ANDROID_HOME: ${{ steps.setup-android.outputs.sdk-path }}
      run: |
        # Wrap execution in Xvfb virtual display so Flet doesn't crash from missing monitor
        xvfb-run --auto-servernum python -m flet build apk

    - name: Export Compiled Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AgriRover-Android-Package
        path: build/apk/*.apk
