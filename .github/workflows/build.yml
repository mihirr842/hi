name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    # We lock this to ubuntu-24.04 to avoid breaking during the OS migration
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libltdl-dev libffi-dev libssl-dev autoconf autotools-dev libtool pkg-config zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
        pip install --upgrade pip
        pip install buildozer cython Kivy

    - name: Initialize and Build APK
      run: |
        # Generates the spec file automatically
        buildozer init
        
        # Accept Android SDK licenses automatically to prevent interactive prompt crash
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        
        # Build the APK in non-interactive mode
        buildozer -v android debug
